<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Arnold Jack - Escape Run PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#87CEEB;overflow:hidden;font-family:'Segoe UI',Arial;touch-action:none}
#topBar{position:absolute;top:0;width:100%;background:rgba(0,0,0,0.8);color:white;display:flex;justify-content:space-between;padding:8px 12px;z-index:10;font-size:13px;font-weight:bold}
#canvasWrap{margin-top:38px}
canvas{display:block;width:100%}
#controls{position:absolute;bottom:0;width:100%;background:#111;display:flex;justify-content:space-between;padding:8px;z-index:10}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:bold;color:white}
#jumpBtn{background:#4CAF50;flex:1;margin-right:8px;font-size:18px}
#donateBtn{background:#FF6F00}
#gameOver{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:16px;text-align:center;display:none;z-index:20;width:90%;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#gameOver h2{color:#d32f2f}
.mpesabox{background:#f5f5f5;border:2px dashed #4CAF50;padding:10px;border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<div id="topBar">
<span>⭐ Score: <b id="score">0</b></span>
<span>🪙 Coins: <b id="coins">0</b></span>
<span>🏆 Best: <b id="best">0</b></span>
</div>

<div id="canvasWrap"><canvas id="c"></canvas></div>

<div id="controls">
<button id="jumpBtn">⬆️ JUMP (TAP)</button>
<button class="btn" id="donateBtn" onclick="document.getElementById('gameOver').style.display='block'">💰 Till</button>
</div>

<div id="gameOver">
<h2 id="goTitle">CAUGHT!</h2>
<p>Score: <b id="finalScore">0</b><br>Best: <b id="finalBest">0</b><br>Coins: <b id="finalCoins">0</b></p>
<div class="mpesabox">
<b>JACK BUILDERS</b><br>
Support Developer<br>
<b style="color:#4CAF50;font-size:18px">Till: 743084252</b><br>
Phone: 0707811193<br>
<small>ArnoldJ33841 GitHub</small>
</div>
<button onclick="location.reload()" style="width:100%;padding:12px;background:#4CAF50;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold">🔁 PLAY AGAIN</button>
<p style="margin-top:8px;font-size:11px">Share: arnoldj33841.github.io/Arnold-jack-game-/</p>
</div>

<script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight-90} resize(); window.onresize=resize;

let score=0,coins=0,best=localStorage.getItem('jackBest')||0,over=false,speed=6,frame=0;
document.getElementById('best').innerText=best;

let p={x:100,y:0,w:48,h:54,vy:0,jumping:false};
let obs=[], coinList=[], chase={x:-90,y:0};

const ground=()=>canvas.height-70;
function playTone(f,d,v=0.1){try{let a=new (window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator();let g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=v;o.start();setTimeout(()=>{o.stop();a.close()},d)}catch(e){}}

function jump(){if(!p.jumping && !over){p.vy=-16;p.jumping=true;playTone(600,100,0.15)}}
document.getElementById('jumpBtn').addEventListener('touchstart',e=>{e.preventDefault();jump()});
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump()});
document.addEventListener('keydown',e=>{if(e.code==='Space')jump()});

function reset(){
obs=[];coinList=[];
for(let i=0;i<5;i++) spawnCoin(canvas.width + i*200);
}

function spawnCoin(x){
coinList.push({x:x||canvas.width+Math.random()*400,y:ground()-30-Math.random()*80,w:24,h:24,taken:false,rot:0});
}

function loop(){
if(over) return; frame++; score+=0.5;
document.getElementById('score').innerText=Math.floor(score);
document.getElementById('coins').innerText=coins;

// spawn
if(frame%85==0) obs.push({x:canvas.width,y:ground()-38,w:32,h:42,type:Math.random()>0.5?'🪨':'🌵'});
if(frame%120==0) spawnCoin();

p.y+=p.vy; p.vy+=0.85;
if(p.y+p.h>=ground()){p.y=ground()-p.h;p.vy=0;p.jumping=false;}
// move
obs.forEach((o,i)=>{o.x-=speed; if(o.x+o.w<0)obs.splice(i,1);
 if(p.x+p.w-10>o.x && p.x+10<o.x+o.w && p.y+p.h-10>o.y){gameOver()} });

coinList.forEach((c,i)=>{
c.x-=speed; c.rot+=0.15;
if(!c.taken && p.x+p.w>c.x && p.x<c.x+c.w && p.y+p.h>c.y && p.y<c.y+c.h){
c.taken=true;coins++;playTone(1200,150,0.2);document.getElementById('coins').innerText=coins;
coinList.splice(i,1);
}else if(c.x<-30){coinList.splice(i,1)}
});

chase.x+=0.5; chase.y=ground()-52;
if(chase.x>p.x-65) gameOver();
if(score%500==0) speed+=0.25;

// DRAW
ctx.clearRect(0,0,canvas.width,canvas.height);
// sky
ctx.fillStyle='#87CEEB';ctx.fillRect(0,0,canvas.width,canvas.height);
// ground
ctx.fillStyle='#7CB342';ctx.fillRect(0,ground(),canvas.width,70);
ctx.fillStyle='#558B2F';ctx.fillRect(0,ground(),canvas.width,8);

ctx.font='44px Arial';ctx.fillText('🏃‍♂️',p.x,p.y+40);
ctx.font='40px Arial';ctx.fillText('🦁',chase.x,chase.y+36);

obs.forEach(o=>{ctx.font='34px Arial';ctx.fillText(o.type,o.x,o.y+32)});
coinList.forEach(c=>{if(!c.taken){ctx.font='24px Arial';ctx.save();ctx.translate(c.x+12,c.y+12);ctx.rotate(c.rot);ctx.fillText('🪙',-12,-4);ctx.restore()}});

if(!over) requestAnimationFrame(loop);
}
function gameOver(){
if(over)return;over=true;playTone(150,600,0.3);
if(Math.floor(score)>best){best=Math.floor(score);localStorage.setItem('jackBest',best)}
document.getElementById('finalScore').innerText=Math.floor(score);
document.getElementById('finalBest').innerText=best;
document.getElementById('finalCoins').innerText=coins;
document.getElementById('gameOver').style.display='block';
}
reset();loop();
</script>
</body>
</html>
