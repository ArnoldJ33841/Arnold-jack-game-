<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUMPING JACK</title>
<style>body{margin:0;background:#5ec6ff;overflow:hidden}canvas{width:100vw;height:100vh;display:block}#top{position:fixed;top:8px;left:0;width:100%;text-align:center;z-index:5}#top b{background:#000;color:#fff;padding:6px 12px;border-radius:20px;font-size:14px}#snd{position:fixed;top:8px;right:8px;z-index:6;background:#fff;border:none;border-radius:20px;padding:5px 10px;font-weight:900;font-size:11px}#over{position:fixed;left:0;top:0;width:100%;height:100%;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;color:#fff;text-align:center;padding:15px}#over.show{display:flex}.box{background:#222;border:3px solid #22c55e;border-radius:12px;padding:15px;max-width:320px;width:90%}.num{background:#22c55e;color:#fff;padding:10px;border-radius:8px;font-size:26px;font-weight:900;margin:8px 0}.btn{width:100%;padding:12px;margin:5px 0;border:none;border-radius:8px;font-weight:900}input{width:100%;padding:12px;border-radius:8px;border:2px solid #22c55e;text-align:center;font-weight:bold;box-sizing:border-box}</style>
</head>
<body>
<div id="top"><b>Score:<span id="sc">0</span> Best:<span id="bs">0</span></b></div>
<button id="snd" onclick="soundOn=!soundOn;this.innerHTML=soundOn?'🔊 ON':'🔇 OFF'">🔊 ON</button>
<canvas id="g"></canvas>
<div id="over"><h2>💀 GAME OVER</h2><h3 id="fs" style="color:yellow"></h3><div class="box"><div class="num">0707811193</div><p style="margin:5px">Pay 20 Bob to Continue</p><button class="btn" style="background:#0ea5e9;color:#fff" onclick="var ph=prompt('M-PESA 07...');if(ph)alert('STK to '+ph+' Pay 20 to 0707811193')">📱 PAY 20 BOB</button><input id="cd" placeholder="M-PESA Code"><button class="btn" style="background:#22c55e;color:#fff;font-size:17px" onclick="pay()">✅ CONTINUE</button><button class="btn" style="background:#555;color:#fff" onclick="location.reload()">RESTART</button></div></div>
<script>
var c=document.getElementById('g'); var x=c.getContext('2d');
var W,H,p,obs=[],coins=[],s=0,bst=0,f=0,dead=0,spd=5,soundOn=1,actx;
function resize(){W=window.innerWidth;H=window.innerHeight;c.width=W;c.height=H;if(p)p.y=H-120-p.h;}
window.addEventListener('resize',resize); resize();
bst=localStorage.getItem('jj_final')||0; document.getElementById('bs').innerHTML=bst;

function play(fq){if(!soundOn)return;try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();var o=actx.createOscillator();o.frequency.value=fq;o.connect(actx.destination);o.start();setTimeout(function(){o.stop();},100);}catch(e){}}

function makePlayer(){p={x:60,y:H-160,w:30,h:44,vy:0,j:0};}

function drawHuman(px,py){
 var run=Math.floor(Math.sin(f*0.4)*6);
 // shadow simple rect
 x.fillStyle='#00000033'; x.fillRect(px+5,py+44,20,4);
 // shoes red
 x.fillStyle='#dc2626'; x.fillRect(px+2,py+40+run/2,10,5); x.fillRect(px+16,py+40-run/2,10,5);
 // legs blue
 x.fillStyle='#1d4ed8'; x.fillRect(px+4,py+28+run/2,7,12); x.fillRect(px+17,py+28-run/2,7,12);
 // body blue hoodie
 x.fillStyle='#2563eb'; x.fillRect(px+2,py+12,26,18);
 // backpack yellow
 x.fillStyle='#fbbf24'; x.fillRect(px+8,py+14,14,10);
 // arms skin
 x.fillStyle='#fdba74'; x.fillRect(px-3,py+14+run/2,6,10); x.fillRect(px+25,py+14-run/2,6,10);
 // head skin
 x.fillStyle='#ffdbac'; x.fillRect(px+6,py+0,18,14);
 // hair
 x.fillStyle='#451a03'; x.fillRect(px+4,py-2,22,8);
 // eyes
 x.fillStyle='#000'; x.fillRect(px+9,py+4,3,3); x.fillRect(px+18,py+4,3,3);
 // smile white
 x.fillStyle='#fff'; x.fillRect(px+10,py+9,10,2);
}

function init(){obs=[];coins=[];s=0;f=0;spd=5;dead=0;makePlayer();document.getElementById('over').style.display='none';document.getElementById('sc').innerHTML=0;loop();}

function loop(){
 if(dead)return;
 f++;
 // SKY solid
 x.fillStyle='#5ec6ff'; x.fillRect(0,0,W,H);
 // GROUND - ALWAYS VISIBLE AT BOTTOM 120px
 x.fillStyle='#22c55e'; x.fillRect(0,H-100,W,100);
 x.fillStyle='#16a34a'; x.fillRect(0,H-100,W,6);
 // moving dots on ground
 x.fillStyle='#15803d'; for(var i=0;i<5;i++){var gx=(f*spd+i*150)%W; x.fillRect(gx,H-40,30,6);}
 
 if(f%85==0)obs.push({x:W,y:H-130,w:26,h:30});
 if(f%95==0)coins.push({x:W,y:H-180-Math.random()*70,r:9});
 
 p.vy+=0.7; p.y+=p.vy;
 if(p.y>H-100-p.h){p.y=H-100-p.h; p.vy=0; p.j=0;}
 
 drawHuman(p.x,p.y);
 
 // obstacles
 for(var a=0;a<obs.length;a++){var o=obs[a];o.x-=spd;x.fillStyle='#78350f';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#fbbf24';x.fillRect(o.x,o.y+6,o.w,5);}
 // coins
 for(var b=0;b<coins.length;b++){var cl=coins[b];cl.x-=spd;x.fillStyle='#facc15';x.beginPath();x.arc(cl.x,cl.y,cl.r,0,6.28);x.fill();x.fillStyle='#fff';x.fillRect(cl.x-2,cl.y-2,2,2);}
 
 for(var c2=0;c2<obs.length;c2++){var o2=obs[c2];if(p.x+4<o2.x+o2.w&&p.x+p.w-4>o2.x&&p.y+2<o2.y+o2.h&&p.y+p.h>o2.y){dead=1;end();return;}}
 var nc=[];for(var d=0;d<coins.length;d++){var cl2=coins[d];if(p.x<cl2.x+9&&p.x+p.w>cl2.x-9&&p.y<cl2.y+9&&p.y+p.h>cl2.y-9){play(900);s+=10;}else if(cl2.x>-20){nc.push(cl2);}}coins=nc;
 var no2=[];for(var e=0;e<obs.length;e++){if(obs[e].x>-30)no2.push(obs[e]);}obs=no2;
 s++; if(f%5==0)document.getElementById('sc').innerHTML=s;
 if(f%600==0)spd+=0.4;
 requestAnimationFrame(loop);
}
function end(){if(s>bst){bst=s;localStorage.setItem('jj_final',bst);document.getElementById('bs').innerHTML=bst;}document.getElementById('fs').innerHTML='Score '+s+' Best '+bst;document.getElementById('over').style.display='flex';document.getElementById('over').className='show';play(150);}
function jmp(){if(dead)return;if(!p.j){p.vy=-11;p.j=1;play(500);}}
c.addEventListener('touchstart',function(e){e.preventDefault();jmp();},{passive:false});
window.addEventListener('keydown',function(e){if(e.code=='Space')jmp();});
function pay(){var v=document.getElementById('cd').value.trim().toUpperCase();if(v.length<8){alert('Lipa 20 bob kwa 0707811193 kwanza! Weka code!');return;}var used=JSON.parse(localStorage.getItem('used')||'[]');if(used.includes(v)){alert('Code used! Lipa mpya!');return;}used.push(v);localStorage.setItem('used',JSON.stringify(used));document.getElementById('over').style.display='none';document.getElementById('cd').value='';dead=0;obs=[];coins=[];p.y=H-100-p.h;p.vy=0;loop();}
init();
</script>
</body>
</html>
