<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Arnold Developers - Jack Runner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:white;overflow:hidden;touch-action:none}
#gameContainer{position:relative;width:100vw;height:100vh;background:linear-gradient(#38bdf8 0%, #e0f2fe 60%, #22c55e 60%, #16a34a 100%)}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;z-index:10;font-weight:bold;text-shadow:0 2px 4px rgba(0,0,0,0.5)}
#ui span{background:rgba(0,0,0,0.5);padding:6px 12px;border-radius:20px;font-size:14px}
#brand{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);padding:6px 14px;border-radius:20px;font-size:12px;letter-spacing:1px;z-index:10}
#gameOver{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:20px;text-align:center}
#gameOver.show{display:flex}
h1{font-size:28px;margin-bottom:8px}
#finalScore{font-size:18px;margin:10px 0;color:#fde047}
#payBox{background:#1e293b;border:2px solid #22c55e;border-radius:16px;padding:20px;margin:15px 0;width:100%;max-width:360px}
#payBox h2{color:#22c55e;font-size:20px;margin-bottom:10px}
#mpesaNum{font-size:24px;font-weight:900;color:#fff;background:#22c55e;padding:8px 16px;border-radius:10px;margin:10px 0;letter-spacing:1px}
.btn{border:none;padding:14px 24px;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;width:100%;margin:6px 0}
.btn-green{background:#22c55e;color:white}
.btn-dark{background:#334155;color:white}
.btn-yellow{background:#eab308;color:black}
input{width:100%;padding:14px;border-radius:10px;border:2px solid #334155;background:#0f172a;color:white;font-size:16px;margin:10px 0;text-align:center}
#howTo{font-size:12px;color:#94a3b8;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<div id="gameContainer">
<div id="brand">ARNOLD DEVELOPERS</div>
<div id="ui">
<span>⭐ <b id="score">0</b></span>
<span>🪙 <b id="coins">0</b></span>
<span>🏆 <b id="best">0</b></span>
</div>
<canvas id="canvas"></canvas>
<div id="gameOver">
<h1>💀 Game Over!</h1>
<div id="finalScore"></div>
<div id="payBox">
<h2>🔓 PAY TO CONTINUE</h2>
<p style="font-size:14px;">Lipa 20 KES to revive & keep your score!</p>
<div id="mpesaNum">M-PESA: 0707811193</div>
<p style="font-size:13px;color:#facc15;">1. Lipa na M-PESA > Buy Goods<br>2. Send 20 KES to 0707811193<br>3. Enter M-PESA Code below</p>
<input type="text" id="mpesaCode" placeholder="Enter Code e.g. QGH5
