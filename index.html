<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JUMPING JACK - Arnold Developers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#38bdf8;overflow:hidden;font-family:Arial;color:white;touch-action:none}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#ui{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;z-index:5;font-weight:bold}
#ui b{background:rgba(0,0,0,0.6);padding:6px 12px;border-radius:20px;font-size:14px}
#brand{position:absolute;top:45px;left:50%;transform:translateX(-50%);z-index:5;background:linear-gradient(90deg,#f59e0b,#eab308);color:black;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:900;letter-spacing:1px;box-shadow:0 2px 8px rgba(0,0,0,0.5)}
#over{position:absolute;inset:0;background:rgba(0,0,0,0.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:10}
#over.show{display:flex}
.box{background:#1e293b;border:3px solid #22c55e;border-radius:16px;padding:18px;width:100%;max-width:340px;margin:12px 0}
.num{font-size:26px;background:#22c55e;padding:10px;border-radius:10px;margin:10px 0;font-weight:900}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin:5px 0}
.green{background:#22c55e;color:white}
.dark{background:#334155;color:white}
input{width:100%;padding:14px;border-radius:10px;border:2px solid #22c55e;margin:10px 0;text-align:center;font-size:16px;color:black}
</style>
</head>
<body>
<div id="ui"><b>⭐ <span id="s">0</span></b><b>🪙 <span id="co">0</span></b><b>🏆 <span id="b">0</span></b></div>
<div id="brand">JUMPING JACK</div>
<canvas id="c"></canvas>
<div id="over">
<h1 style="font-size:28px">💀 GAME OVER</h1>
<h2 id="fs" style="color:#fde047;margin:8px"></h2>
<div class="box">
<h3 style="color:#22c55e">PAY 20 BOB TO CONTINUE</h3>
<p style="font-size:13px">Lipa 20 Bob keep playing Jumping Jack!</p>
<div class="num">0707811193</div>
<p style="font-size:12px;color:#facc15">M-PESA > Send Money > 0707811193 > 20 KES</p>
<input id="code" placeholder="Enter M-PESA Code">
<button class="btn green" onclick="pay()">✅ I PAID 20 BOB - CONTINUE</button>
</div>
<button class="btn dark" onclick="restart()">🔄 New Game</button>
<p style="font-size:10px;color:gray;margin-top:8px">JUMPING JACK by Arnold Developers - 0707811193</p>
</div>
<script>
let can=document.getElementById('c'),ctx=can.getContext('2d'),W,H,pl,obs=[],coins=[],sc=0,coin=0,sp=6,fr=0,dead=false,best=localStorage.getItem('jj_best')||0;
document.getElementById('b').innerText=best;
function resize(){W=can.width=innerWidth;H=can.height=innerHeight;if(pl) pl.y=H*0.6-pl.h}
resize();addEventListener('resize',resize);
pl={x:60,y:300,w:32,h:42,vy:0,j:false}
function init(){obs=[];coins=[];sc=0;coin=0;sp=6;fr=0;dead=false;pl={x:60,y:H*0.6-50,w:32,h:42,vy:0,j:false};document.getElementById('s').innerText=0;document.getElementById('co').innerText=0;document.getElementById('over').classList.remove('show')}
function loop(){if(dead) return;fr++;ctx.clearRect(0,0,W,H);let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#38bdf8');grad.addColorStop(0.6,'#e0f2fe');grad.addColorStop(0.6,'#22c55e');grad.addColorStop(1,'#16a34a');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
if(fr%75===0){let h=35+Math.random()*50;obs.push({x:W,y:H*0.6+20-h,w:28,h:h})}
if(fr%95===0){coins.push({x:W,y:H*0.6-70-Math.random()*120,r:10,d:false})}
pl.vy+=0.75;pl.y+=pl.vy;if(pl.y>H*0.6-pl.h){pl.y=H*0.6-pl.h;pl.vy=0;pl.j=false}
ctx.fillStyle='#f59e0b';ctx.fillRect(pl.x,pl.y,pl.w,pl.h);ctx.fillStyle='white';ctx.fillRect(pl.x+5,pl.y-8,pl.w-10,8);ctx.fillStyle='black';ctx.fillRect(pl.x+7,pl.y+8,5,5);ctx.fillRect(pl.x+20,pl.y+8,5,5);
ctx.fillStyle='#dc2626';for(let o of obs){o.x-=sp;ctx.fillRect(o.x,o.y,o.w,o.h)}obs=obs.filter(o=>o.x>-40);
ctx.fillStyle='#facc15';for(let c of coins){c.x-=sp;if(!c.d){ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,6.28);ctx.fill()}} 
for(let o of obs){if(pl.x<o.x+o.w&&pl.x+pl.w>o.x&&pl.y<o.y+o.h&&pl.y+pl.h>o.y){die();return}}
for(let c of coins){if(!c.d&&pl.x<c.x+c.r&&pl.x+pl.w>c.x-c.r&&pl.y<c.y+c.r&&pl.y+pl.h>c.y-c.r){c.d=true;coin++;sc+=20;document.getElementById('co').innerText=coin}}
coins=coins.filter(c=>c.x>-20&&!c.d);sc++;if(fr%5==0)document.getElementById('s').innerText=sc;if(fr%500==0)sp+=0.4;requestAnimationFrame(loop)}
function die(){dead=true;if(sc>best){best=sc;localStorage.setItem('jj_best',best);document.getElementById('b').innerText=best}document.getElementById('fs').innerText='Score: '+sc+' | Best: '+best;document.getElementById('over').classList.add('show')}
function jump(){if(!pl.j&&!dead){pl.vy=-13.5;pl.j=true}}can.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}})
function restart(){init();loop()}
function pay(){let v=document.getElementById('code').value.trim();if(v.length<5){alert('Lipa 20 BOB to 0707811193 first!');return}alert('20 BOB Verified! Continuing Jumping Jack...');dead=false;pl.y=H*0.6-pl.h;pl.vy=0;obs=[];document.getElementById('over').classList.remove('show');document.getElementById('code').value='';loop()}
init();loop();
</script>
</body>
</html>
