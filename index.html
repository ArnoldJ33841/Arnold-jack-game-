<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arnold Jack Escape Run</title>
<style>
body{margin:0;background:#87CEEB;overflow:hidden;font-family:Arial}
canvas{display:block;margin:0 auto}
#score{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:bold;background:#fff;padding:6px 18px;border-radius:20px}
#hint{position:absolute;bottom:15px;width:100%;text-align:center;color:#fff;font-weight:bold}
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="c"></canvas>
<div id="hint">TAP / SPACE TO JUMP - Support: 0707811193</div>
<script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
canvas.width=innerWidth;canvas.height=innerHeight-60;
let score=0,over=false,speed=6,frame=0;
let p={x:100,y:0,w:50,h:60,vy:0,j:false};let obs=[],chas=[];
const ground=canvas.height-90;
function jump(){if(!p.j){p.vy=-17;p.j=true;}}
addEventListener('keydown',e=>{if(e.code=='Space')jump()});addEventListener('touchstart',jump);addEventListener('mousedown',jump);
function loop(){
if(over)return;frame++;score++;
document.getElementById('score').innerText='Score: '+Math.floor(score/10);
if(frame%90==0)obs.push({x:canvas.width,y:ground-35,w:30,h:40});
if(frame%180==0)chas.push({x:-80,y:ground-55});
p.y+=p.vy;p.vy+=0.8;if(p.y+p.h>=ground){p.y=ground-p.h;p.vy=0;p.j=false;}
obs.forEach((o,i)=>{o.x-=speed;if(o.x+o.w<0)obs.splice(i,1);if(p.x+p.w>o.x&&p.x<o.x+o.w&&p.y+p.h>o.y)over=true;});
chas.forEach((c,i)=>{c.x+=speed-1.5;if(c.x>p.x-70)over=true;});
if(score%600==0)speed+=0.4;
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#8BC34A';ctx.fillRect(0,ground,canvas.width,90);
ctx.font='48px Arial';ctx.fillText('🏃‍♂️',p.x,p.y+45);
obs.forEach(o=>{ctx.fillStyle='#5D4037';ctx.fillRect(o.x,o.y,o.w,o.h);});
chas.forEach(c=>{ctx.font='42px Arial';ctx.fillText('🦁',c.x,c.y+40);});
if(over){
ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='36px Arial';ctx.fillText('CAUGHT! GAME OVER',canvas.width/2,canvas.height/2);
ctx.font='18px Arial';ctx.fillText('Score '+Math.floor(score/10)+' - Tap to Reload - JACK BUILDERS 0707811193',canvas.width/2,canvas.height/2+40);
canvas.addEventListener('click',()=>location.reload(),{once:true});
}else requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
