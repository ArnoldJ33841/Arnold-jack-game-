<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JUMPING JACK</title>
<style>
body{margin:0;overflow:hidden;background:#5ec6ff;font-family:Arial}
canvas{display:block;width:100vw;height:100vh}
#top{position:fixed;top:6px;left:0;width:100%;display:flex;justify-content:space-around;z-index:2}
#top span{background:#000;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:900}
#over{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;color:#fff;padding:15px;text-align:center}
#over.show{display:flex}
.box{background:#1e293b;border:2px solid #22c55e;border-radius:14px;padding:16px;max-width:320px;width:92%}
.num{background:#22c55e;color:#fff;padding:10px;border-radius:10px;font-size:24px;font-weight:900;margin:8px 0}
.btn{width:100%;padding:12px;margin:5px 0;border:none;border-radius:10px;font-weight:900}
input{width:100%;padding:12px;border-radius:10px;border:2px solid #22c55e;text-align:center;font-weight:bold;box-sizing:border-box}
</style>
</head>
<body>
<div id="top"><span>⭐ <b id="sc">0</b></span><span>ARNOLD DEVELOPERS 🪙 <b id="coin">0</b></span><span>🏆 <b id="bs">0</b></span></div>
<canvas id="g"></canvas>
<div id="over">
<h2>💀 GAME OVER</h2>
<h3 id="fs" style="color:yellow"></h3>
<div class="box">
<p style="margin:0;font-size:12px">Lipa 20 to continue</p>
<div class="num">0707811193</div>
<div style="font-size:11px;text-align:left;background:#0f172a;padding:8px;border-radius:8px">1. M-PESA Buy Goods<br>2. Till: 0707811193 - 20<br>3. Paste SMS below</div>
<input id="cd" placeholder="Paste M-PESA SMS: QGH..." maxlength="200">
<div id="detected" style="color:#22c55e;font-weight:bold;font-size:12px;display:none;margin-top:4px"></div>
<button class="btn" style="background:#22c55e;color:#fff;font-size:17px" onclick="pay()">✅ CONTINUE</button>
<button class="btn" style="background:#334155;color:#ccc" onclick="location.reload()">RESTART</button>
</div>
</div>
<script>
var c=document.getElementById('g'),x=c.getContext('2d'),W,H,p,obs=[],coins=[],score=0,bst=0,f=0,dead=0,spd=6;
function RS(){W=innerWidth;H=innerHeight;c.width=W;c.height=H;}
RS();addEventListener('resize',RS);
bst=localStorage.getItem('jj_best')||0;document.getElementById('bs').innerHTML=bst;
function human(px,py){
 // FIXED - BIG VISIBLE HUMAN - WILL ALWAYS SHOW
 var r=Math.sin(f*0.4)*4;
 // shadow
 x.fillStyle='rgba(0,0,0,0.2)';x.fillRect(px+5,py+46,30,6);
 // shoes red - BIG
 x.fillStyle='#dc2626';x.fillRect(px+2,py+42,14,8);x.fillRect(px+20,py+42,14,8);
 x.fillStyle='#fff';x.fillRect(px+4,py+44,10,2);x.fillRect(px+22,py+44,10,2);
 // pants blue
 x.fillStyle='#1e40af';x.fillRect(px+4,py+24,12,20);x.fillRect(px+18,py+24,12,20);
 // hoodie blue
 x.fillStyle='#2563eb';x.fillRect(px+2,py+10,32,20);
 // yellow backpack
 x.fillStyle='#facc15';x.fillRect(px+8,py+12,20,14);x.fillStyle='#eab308';x.fillRect(px+10,py+14,16,2);
 // hands
 x.fillStyle='#fdba74';x.fillRect(px-4,py+14+r,7,10);x.fillRect(px+31,py+14-r,7,10);
 // head
 x.fillStyle='#ffdbac';x.fillRect(px+8,py-2,20,16);
 // hair
 x.fillStyle='#3f2305';x.fillRect(px+6,py-4,24,8);
 // eyes
 x.fillStyle='#000';x.fillRect(px+11,py+2,4,4);x.fillRect(px+21,py+2,4,4);
 x.fillStyle='#fff';x.fillRect(px+12,py+8,12,3);
}
function init(){
 obs=[];coins=[];score=0;f=0;spd=6;dead=0;
 p={x:70,y:H-160,w:36,h:50,vy:0,jumping:false};
 document.getElementById('over').style.display='none';
 document.getElementById('sc').innerHTML=0;
 document.getElementById('coin').innerHTML=0;
 loop();
}
function loop(){
 if(dead)return;
 f++;
 x.fillStyle='#87CEEB';x.fillRect(0,0,W,H);
 x.fillStyle='#5ec6ff';x.fillRect(0,0,W,H*0.7);
 x.fillStyle='#22c55e';x.fillRect(0,H-90,W,90);
 x.fillStyle='#16a34a';x.fillRect(0,H-90,W,8);
 if(f%90==0)obs.push({x:W+10,y:H-120,w:28,h:30});
 if(f%110==0)coins.push({x:W+10,y:H-180-Math.random()*70,r:10});
 p.vy+=0.8;p.y+=p.vy;
 if(p.y>H-90-p.h){p.y=H-90-p.h;p.vy=0;p.jumping=false;}
 human(p.x,p.y);
 for(var i=0;i<obs.length;i++){var o=obs[i];o.x-=spd;x.fillStyle='#78350f';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#fbbf24';x.fillRect(o.x,o.y+5,o.w,4);}
 for(var j=0;j<coins.length;j++){var cl=coins[j];cl.x-=spd;x.fillStyle='#facc15';x.beginPath();x.arc(cl.x,cl.y,cl.r,0,6.28);x.fill();x.fillStyle='#fff';x.fillRect(cl.x-2,cl.y-4,4,2);}
 // collision
 for(var k=0;k<obs.length;k++){var o2=obs[k];if(p.x+6<o2.x+o2.w&&p.x+p.w-6>o2.x&&p.y+4<o2.y+o2.h&&p.y+p.h-4>o2.y){dead=1;document.getElementById('fs').innerHTML='Score '+score;if(score>bst){bst=score;localStorage.setItem('jj_best',bst);document.getElementById('bs').innerHTML=bst;}document.getElementById('over').style.display='flex';document.getElementById('over').className='show';return;}}
 var nc=[];for(var l=0;l<coins.length;l++){var cl2=coins[l];if(p.x<cl2.x+10&&p.x+p.w>cl2.x-10&&p.y<cl2.y+10&&p.y+p.h>cl2.y-10){score+=10;document.getElementById('sc').innerHTML=score;document.getElementById('coin').innerHTML=score;}else if(cl2.x>-20)nc.push(cl2);}coins=nc;
 var no2=[];for(var m=0;m<obs.length;m++){if(obs[m].x>-40)no2.push(obs[m]);}obs=no2;
 if(f%600==0)spd+=0.4;
 requestAnimationFrame(loop);
}
function jump(){if(dead)return;if(!p.jumping){p.vy=-13;p.jumping=true;}}
c.addEventListener('touchstart',function(e){e.preventDefault();jump();},{passive:false});
c.addEventListener('mousedown',jump);
var inp=document.getElementById('cd');
inp.addEventListener('input',function(){
 var t=this.value.toUpperCase();
 var mm=t.match(/[A-Z0-9]{10}/);
 if(mm){document.getElementById('detected').style.display='block';document.getElementById('detected').innerHTML='✅ Code: '+mm[0];}
});
function pay(){
 var raw=inp.value.trim();if(!raw){alert('Paste M-PESA SMS!\nExample: QGH7YH9P Confirmed');return;}
 var up=raw.toUpperCase();var mm=up.match(/[A-Z0-9]{10}/);var v=mm?mm[0]:up.substring(0,10);
 if(v.length<8){alert('Invalid! Paste like QGH7YH9P Confirmed');return;}
 var used=JSON.parse(localStorage.getItem('usedCodes2')||'[]');if(used.includes(v)){alert('Code '+v+' used! Pay new 20');return;}
 used.push(v);localStorage.setItem('usedCodes2',JSON.stringify(used));
 document.getElementById('over').style.display='none';inp.value='';document.getElementById('detected').style.display='none';
 dead=0;obs=[];coins=[];p.y=H-90-p.h;p.vy=0;loop();
}
init();
</script>
</body>
</html>
