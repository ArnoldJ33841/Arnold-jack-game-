<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arnold Developers Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#0f172a;color:white;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;background:linear-gradient(#38bdf8,#e0f2fe 60%,#22c55e 60%)}
#ui{position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;font-weight:bold}
#brand{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:black;padding:5px 15px;border-radius:20px;font-size:12px}
#over{position:absolute;inset:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#over.show{display:flex}
.box{background:#1e293b;border:3px solid #22c55e;border-radius:15px;padding:20px;width:100%;max-width:350px;margin:15px 0}
.num{font-size:28px;background:#22c55e;padding:10px;border-radius:10px;margin:10px 0;font-weight:900}
.btn{width:100%;padding:15px;border:none;border-radius:10px;font-weight:bold;font-size:17px;margin:5px 0}
.green{background:#22c55e;color:white}
.dark{background:#333;color:white}
input{width:100%;padding:15px;border-radius:10px;border:none;margin:10px 0;text-align:center;font-size:16px}
</style>
</head>
<body>
<div id="brand">ARNOLD DEVELOPERS</div>
<div id="ui"><span>Score: <b id="s">0</b></span><span>Best: <b id="b">0</b></span></div>
<canvas id="c"></canvas>
<div id="over">
<h1 style="font-size:32px">GAME OVER</h1>
<h2 id="fs" style="color:yellow;margin:10px"></h2>
<div class="box">
<h2 style="color:#22c55e">PAY 20 BOB TO CONTINUE</h2>
<p>Lipa 20 Bob to keep playing!</p>
<div class="num">0707811193</div>
<p style="font-size:13px;color:yellow">M-PESA > Send Money > 0707811193 > 20 KES<br>Enter M-PESA code below</p>
<input id="code" placeholder="Enter M-PESA Code">
<button class="btn green" onclick="pay()">✅ PAY 20 BOB & CONTINUE</button>
<p style="font-size:11px;color:gray">WhatsApp code to 0707811193 for instant verify</p>
</div>
<button class="btn dark" onclick="location.reload()">🔄 Start New Game (Score Lost)</button>
<p style="font-size:10px;color:gray;margin-top:10px">Arnold Developers 2026 - 0707811193</p>
</div>
<script>
let W,H,pl,obs=[],co=[],sc=0,sp=5,fr=0,dead=false,can=document.getElementById('c'),ctx=can.getContext('2d'),best=localStorage.getItem('ab')||0;
document.getElementById('b').innerText=best;
function sz(){W=can.width=innerWidth;H=can.height=innerHeight}sz();addEventListener('resize',sz);
pl={x:70,y:H*0.6-40,w:35,h:45,vy:0,j:false}
function loop(){if(dead)return;fr++;if(fr%75==0)obs.push({x:W,y:H*0.6+20-(40+Math.random()*60),w:28,h:40+Math.random()*60});if(fr%110==0)co.push({x:W,y:H*0.6-100-Math.random()*100,w:20,h:20,d:false});ctx.clearRect(0,0,W,H);ctx.fillStyle='#16a34a';ctx.fillRect(0,H*0.6+20,W,1000);pl.vy+=0.8;pl.y+=pl.vy;if(pl.y>H*0.6+20-pl.h){pl.y=H*0.6+20-pl.h;pl.vy=0;pl.j=false}ctx.fillStyle='#f59e0b';ctx.fillRect(pl.x,pl.y,pl.w,pl.h);ctx.fillStyle='red';for(let o of obs){o.x-=sp;ctx.fillRect(o.x,o.y,o.w,o.h)}obs=obs.filter(o=>o.x>-30);ctx.fillStyle='gold';for(let c of co){c.x-=sp;if(!c.d){ctx.beginPath();ctx.arc(c.x,c.y,10,0,7);ctx.fill()}}for(let o of obs){if(pl.x<o.x+o.w&&pl.x+pl.w>o.x&&pl.y<o.y+o.h&&pl.y+pl.h>o.y){end();return}}for(let c of co){if(!c.d&&pl.x<c.x+10&&pl.x+pl.w>c.x-10&&pl.y<c.y+10&&pl.y+pl.h>c.y-10){c.d=true;sc+=15}}co=co.filter(c=>!c.d&&c.x>-20);sc++;if(fr%15==0)document.getElementById('s').innerText=sc;if(fr%400==0)sp+=0.2;requestAnimationFrame(loop)}
function end(){dead=true;if(sc>best){best=sc;localStorage.setItem('ab',best);document.getElementById('b').innerText=best}document.getElementById('fs').innerText='Score: '+sc+' | Best: '+best;document.getElementById('over').classList.add('show')}
function jump(){if(!pl.j&&!dead){pl.vy=-14;pl.j=true}}can.addEventListener('touchstart',jump);addEventListener('keydown',e=>{if(e.code=='Space')jump()})
function pay(){let v=document.getElementById('code').value.trim();if(v.length<6){alert('Lipa 20 Bob to 0707811193 first, then enter M-PESA code!');return}alert('20 Bob Received! Continuing...');dead=false;pl.y=H*0.6-40-pl.h;pl.vy=0;obs=[];document.getElementById('over').classList.remove('show');document.getElementById('code').value='';loop()}
loop();
</script>
</body>
</html>
