<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JUMPING JACK</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#5ec6ff;height:100%;font-family:Arial}canvas{display:block;width:100%;height:100%}#t{position:absolute;top:10px;width:100%;text-align:center;z-index:2}#t b{background:#000;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px}#snd{position:absolute;top:10px;right:10px;z-index:3;background:#fff;border-radius:20px;padding:5px 10px;font-size:12px;border:none;font-weight:900}#o{position:absolute;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9;padding:18px;text-align:center;color:#fff}#o.show{display:flex}.bx{background:#1e293b;border:3px solid #22c55e;border-radius:14px;padding:16px;max-width:320px;width:100%}.nm{font-size:26px;background:#22c55e;padding:10px;border-radius:10px;font-weight:900;margin:6px 0}.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;margin:5px 0;font-size:15px;cursor:pointer;text-decoration:none;display:block;text-align:center}.g{background:#22c55e;color:#fff}.y{background:#eab308;color:#000}.r{background:#555;color:#fff}.bl{background:#0ea5e9;color:#fff}input{width:100%;padding:12px;border-radius:10px;border:2px solid #22c55e;margin:8px 0;text-align:center;font-weight:bold}</style>
</head>
<body>
<div id="t"><b>Score:<span id="sc">0</span> Best:<span id="bs">0</span></b></div>
<button id="snd" onclick="toggleSound()">🔊 SOUND ON</button>
<canvas id="g"></canvas>
<div id="o"><h2>💀 GAME OVER</h2><h3 id="fs" style="color:yellow"></h3><div class="bx"><div class="nm">0707811193</div><button class="btn bl" onclick="stkPush()">📱 PAY 20 BOB - STK</button><a class="btn y" href="https://wa.me/254707811193?text=Paid%2020%20JACK" target="_blank">💬 WHATSAPP</a><input id="cd" placeholder="M-PESA Code"><button class="btn g" onclick="pay()">✅ CONTINUE</button><button class="btn r" onclick="init()">RESTART</button></div></div>
<script>
var c=document.getElementById('g'),x=c.getContext('2d');
var W,H,p,obs=[],coins=[],s=0,bst=0,f=0,dead=0,soundOn=1,audioCtx;
bst=localStorage.getItem('jj_final2')||0; document.getElementById('bs').innerHTML=bst;
function R(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}R();window.addEventListener('resize',R);
function initAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function playTone(fr,dur,vol){if(!soundOn)return;initAudio();try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=fr;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur);}catch(e){}}
function sJump(){playTone(450,0.12,0.4); setTimeout(function(){playTone(700,0.12,0.3);},80);}
function sCoin(){playTone(900,0.1,0.4); setTimeout(function(){playTone(1300,0.15,0.3);},70);}
function sDie(){playTone(200,0.3,0.5); setTimeout(function(){playTone(80,0.5,0.4);},150);}
function toggleSound(){soundOn=!soundOn; document.getElementById('snd').innerHTML=soundOn?'🔊 SOUND ON':'🔇 OFF'; if(soundOn)initAudio();}

function init(){obs=[];coins=[];s=0;f=0;spd=5.5;dead=0;p={x:70,y:H-130,w:34,h:52,vy:0,j:0};document.getElementById('o').className='';document.getElementById('sc').innerHTML=0;requestAnimationFrame(loop);}
var spd=5.5;

function drawHuman(px,py){
 var bob = Math.sin(f*0.25)*2;
 var run = Math.sin(f*0.32)*6;
 // shadow
 x.fillStyle='rgba(0,0,0,0.25)'; x.beginPath(); x.ellipse(px+17, py+54, 15, 4, 0,0,6.28); x.fill();
 // SHOES RED
 x.fillStyle='#dc2626'; x.fillRect(px+4, py+50+run/2, 12, 5); x.fillRect(px+18, py+50-run/2, 12, 5);
 x.fillStyle='#ffffff'; x.fillRect(px+4, py+52+run/2, 12, 2);
 // JEANS BLUE
 x.fillStyle='#1d4ed8'; x.fillRect(px+6, py+36+run/2, 8, 15); x.fillRect(px+20, py+36-run/2, 8, 15);
 // HOODIE BLUE
 x.fillStyle='#2563eb'; x.fillRect(px+3, py+16, 28, 22);
 x.fillStyle='#1e40af'; x.fillRect(px+3, py+16, 28, 5);
 // BACKPACK YELLOW - visible human feature
 x.fillStyle='#fbbf24'; x.fillRect(px+10, py+19, 14, 12);
 x.fillStyle='#92400e'; x.fillRect(px+12, py+21, 10, 2); x.fillRect(px+12, py+25, 10, 2);
 // ARMS SKIN
 x.fillStyle='#fdba74'; x.fillRect(px-3, py+19+run/2, 8, 12); x.fillRect(px+27, py+19-run/2, 8, 12);
 x.fillStyle='#374151'; x.fillRect(px-3, py+28+run/2, 8, 5); x.fillRect(px+27, py+28-run/2, 8, 5);
 // HEAD - REAL HUMAN FACE
 x.fillStyle='#ffdbac'; x.beginPath(); x.arc(px+17, py+8+bob, 11, 0, 6.28); x.fill();
 // HAIR BROWN
 x.fillStyle='#451a03'; x.fillRect(px+6, py-2+bob, 22, 10); x.beginPath(); x.arc(px+17, py+3+bob, 12, 3.14, 6.28); x.fill();
 // EYES
 x.fillStyle='#000'; x.beginPath(); x.arc(px+12, py+8+bob, 2, 0, 6.28); x.arc(px+22, py+8+bob, 2, 0, 6.28); x.fill();
 x.fillStyle='#fff'; x.beginPath(); x.arc(px+13, py+7+bob, 0.8, 0, 6.28); x.arc(px+23, py+7+bob, 0.8, 0, 6.28); x.fill();
 // SMILE WHITE
 x.fillStyle='#fff'; x.fillRect(px+13, py+12+bob, 8, 3);
 x.strokeStyle='#000'; x.strokeRect(px+13, py+12+bob, 8, 3);
}

function drawBG(){
 var grad=x.createLinearGradient(0,0,0,H*0.65); grad.addColorStop(0,'#38bdf8'); grad.addColorStop(1,'#bae6fd'); x.fillStyle=grad; x.fillRect(0,0,W,H*0.65);
 x.fillStyle='rgba(255,255,255,0.9)'; for(var i=0;i<3;i++){var cx=(f*0.4+i*320)%(W+100)-50; x.beginPath(); x.arc(cx,60+i*30,15,0,6.28); x.arc(cx+18,60+i*30,20,0,6.28); x.arc(cx+36,60+i*30,14,0,6.28); x.fill();}
 x.fillStyle='#22c55e'; x.fillRect(0,H*0.65,W,H*0.35);
 x.fillStyle='#16a34a'; for(var i=0;i<W;i+=40){x.fillRect((i+f)%W,H*0.65+8,20,3);}
}

function loop(){
 if(dead) return;
 f++; x.clearRect(0,0,W,H); drawBG();
 if(f%80==0) obs.push({x:W,y:H*0.65-36,w:28,h:36});
 if(f%95==0) coins.push({x:W,y:H*0.65-85-Math.random()*90,r:10});
 p.vy+=0.75; p.y+=p.vy; if(p.y>H*0.65-p.h){p.y=H*0.65-p.h; p.vy=0; p.j=0;}
 drawHuman(p.x,p.y);
 // obstacles
 for(var i=0;i<obs.length;i++){var o=obs[i]; o.x-=spd; x.fillStyle='#78350f'; x.fillRect(o.x,o.y,o.w,o.h); x.fillStyle='#fbbf24'; x.fillRect(o.x,o.y+8,o.w,5); x.fillRect(o.x,o.y+20,o.w,5);}
 // coins
 for(var j=0;j<coins.length;j++){var cl=coins[j]; cl.x-=spd; x.fillStyle='#facc15'; x.strokeStyle='#a16207'; x.lineWidth=2; x.beginPath(); x.arc(cl.x,cl.y,cl.r,0,6.28); x.fill(); x.stroke();}
 // collisions
 for(var k=0;k<obs.length;k++){var o2=obs[k]; if(p.x+5<o2.x+o2.w && p.x+p.w-5>o2.x && p.y+5<o2.y+o2.h && p.y+p.h-2>o2.y){sDie(); end(); return;}}
 var newCoins=[]; for(var l=0;l<coins.length;l++){var cl2=coins[l]; if(p.x<cl2.x+cl2.r && p.x+p.w>cl2.x-cl2.r && p.y<cl2.y+cl2.r && p.y+p.h>cl2.y-cl2.r){sCoin(); s+=20;} else if(cl2.x>-30){newCoins.push(cl2);}} coins=newCoins;
 var newObs=[]; for(var m=0;m<obs.length;m++){if(obs[m].x>-40)newObs.push(obs[m]);} obs=newObs;
 s++; if(f%6==0)document.getElementById('sc').innerHTML=s; if(f%500==0)spd+=0.3; requestAnimationFrame(loop);
}
function end(){dead=1; if(s>bst){bst=s; localStorage.setItem('jj_final2',bst); document.getElementById('bs').innerHTML=bst;} document.getElementById('fs').innerHTML='Score: '+s+' Best: '+bst; document.getElementById('o').className='show';}
function jmp(){if(!p.j&&!dead){sJump(); p.vy=-13; p.j=1;}}
c.addEventListener('touchstart',function(e){e.preventDefault(); if(!dead)jmp();},{passive:false});
window.addEventListener('keydown',function(e){if(e.code=='Space'&&!dead)jmp();});
function stkPush(){var ph=prompt('Enter M-PESA 07... to get STK:'); if(!ph||ph.length<10){alert('Invalid');return;} alert('STK sent to '+ph+'! Check phone, enter PIN on phone!');}
function pay(){var v=document.getElementById('cd').value.trim(); if(v.length<8){alert('Pay first!');return;} alert('Verified!'); dead=0; p={x:70,y:H*0.65-p.h,w:34,h:52,vy:0,j:0}; obs=[];coins=[];document.getElementById('o').className='';document.getElementById('cd').value=''; requestAnimationFrame(loop);}
init();
</script>
</body>
</html>
