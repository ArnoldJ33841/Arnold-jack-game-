<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUMPING JACK</title>
<style>
body{margin:0;overflow:hidden;background:#5ec6ff;font-family:Arial}
canvas{display:block;width:100vw;height:100vh}
#top{position:fixed;top:8px;left:0;width:100%;text-align:center;z-index:2}
#top b{background:#000;color:#fff;padding:6px 14px;border-radius:20px}
#snd{position:fixed;top:8px;right:8px;z-index:3;background:#fff;border:none;border-radius:20px;padding:5px 10px;font-weight:900;font-size:11px}
#over{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;color:#fff;padding:15px;text-align:center}
#over.show{display:flex}
.box{background:#1e293b;border:2px solid #22c55e;border-radius:14px;padding:16px;max-width:330px;width:100%}
.num{background:#22c55e;color:#fff;padding:10px;border-radius:10px;font-size:26px;font-weight:900;margin:8px 0}
.btn{width:100%;padding:12px;margin:5px 0;border:none;border-radius:10px;font-weight:900}
input{width:100%;padding:12px;border-radius:10px;border:2px solid #22c55e;text-align:center;font-weight:bold;box-sizing:border-box}
</style>
</head>
<body>
<div id="top"><b>Score:<span id="sc">0</span> Best:<span id="bs">0</span></b></div>
<button id="snd" onclick="soundOn=!soundOn;this.innerHTML=soundOn?'🔊 ON':'🔇 OFF'">🔊 ON</button>
<canvas id="g"></canvas>
<div id="over">
<h2>💀 GAME OVER</h2>
<h3 id="fs" style="color:yellow"></h3>
<div class="box">
<div class="num">0707811193</div>
<p style="margin:6px">Pay 20 Bob to Continue</p>
<button class="btn" style="background:#0ea5e9;color:#fff" onclick="var p=prompt('Your 07 number:');if(p)alert('STK sent to '+p+'! Pay 20 to 0707811193')">📱 PAY 20 BOB - STK</button>
<input id="cd" placeholder="M-PESA Code" maxlength="10">
<button class="btn" style="background:#22c55e;color:#fff;font-size:17px" onclick="pay()">✅ CONTINUE</button>
<button class="btn" style="background:#444;color:#ccc" onclick="location.reload()">RESTART</button>
</div>
</div>
<script>
var c=document.getElementById('g'),x=c.getContext('2d'),W,H,p,obs=[],coins=[],s=0,bst=0,f=0,dead=0,spd=5,soundOn=1,actx;
function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H;}
resize();addEventListener('resize',resize);
bst=localStorage.getItem('jj_final')||0;document.getElementById('bs').innerHTML=bst;
function tone(f){if(!soundOn)return;try{if(!actx)actx=new (AudioContext||webkitAudioContext)();var o=actx.createOscillator();o.frequency.value=f;o.connect(actx.destination);o.start();setTimeout(function(){o.stop()},90);}catch(e){}}
function drawHuman(px,py){
 var r=Math.sin(f*0.35)*5;
 x.fillStyle='#0003';x.fillRect(px+4,py+44,22,4);
 x.fillStyle='#dc2626';x.fillRect(px+2,py+40+r/2,10,5);x.fillRect(px+16,py+40-r/2,10,5);
 x.fillStyle='#1d4ed8';x.fillRect(px+4,py+28+r/2,7,12);x.fillRect(px+17,py+28-r/2,7,12);
 x.fillStyle='#2563eb';x.fillRect(px+2,py+12,26,18);
 x.fillStyle='#fbbf24';x.fillRect(px+8,py+14,14,10);
 x.fillStyle='#fdba74';x.fillRect(px-3,py+14+r/2,6,10);x.fillRect(px+25,py+14-r/2,6,10);
 x.fillStyle='#ffdbac';x.fillRect(px+6,py+0,18,14);
 x.fillStyle='#451a03';x.fillRect(px+4,py-2,22,8);
 x.fillStyle='#000';x.fillRect(px+9,py+4,3,3);x.fillRect(px+18,py+4,3,3);
 x.fillStyle='#fff';x.fillRect(px+10,py+9,10,2);
}
function init(){obs=[];coins=[];s=0;f=0;spd=5;dead=0;p={x:60,y:H-150,w:30,h:44,vy:0,j:0};document.getElementById('over').className='';document.getElementById('over').style.display='none';document.getElementById('sc').innerHTML=0;loop();}
function loop(){
 if(dead)return;f++;
 x.fillStyle='#5ec6ff';x.fillRect(0,0,W,H);
 x.fillStyle='#22c55e';x.fillRect(0,H-100,W,100);x.fillStyle='#16a34a';x.fillRect(0,H-100,W,6);
 x.fillStyle='#15803d';for(var i=0;i<5;i++){var gx=(f*spd+i*150)%W;x.fillRect(gx,H-40,30,6);}
 if(f%80==0)obs.push({x:W,y:H-130,w:26,h:30});
 if(f%90==0)coins.push({x:W,y:H-180-Math.random()*60,r:9});
 p.vy+=0.7;p.y+=p.vy;if(p.y>H-100-p.h){p.y=H-100-p.h;p.vy=0;p.j=0;}
 drawHuman(p.x,p.y);
 for(var a=0;a<obs.length;a++){var o=obs[a];o.x-=spd;x.fillStyle='#78350f';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#fbbf24';x.fillRect(o.x,o.y+6,o.w,4);}
 for(var b=0;b<coins.length;b++){var cl=coins[b];cl.x-=spd;x.fillStyle='#facc15';x.beginPath();x.arc(cl.x,cl.y,cl.r,0,6.28);x.fill();}
 for(var c2=0;c2<obs.length;c2++){var o2=obs[c2];if(p.x+4<o2.x+o2.w&&p.x+p.w-4>o2.x&&p.y+2<o2.y+o2.h&&p.y+p.h>o2.y){dead=1;document.getElementById('fs').innerHTML='Score '+s+' Best '+bst;if(s>bst){bst=s;localStorage.setItem('jj_final',bst);document.getElementById('bs').innerHTML=bst;}document.getElementById('over').style.display='flex';document.getElementById('over').className='show';tone(120);return;}}
 var nc=[];for(var d=0;d<coins.length;d++){var cl2=coins[d];if(p.x<cl2.x+9&&p.x+p.w>cl2.x-9&&p.y<cl2.y+9&&p.y+p.h>cl2.y-9){tone(800);s+=10;}else if(cl2.x>-20)nc.push(cl2);}coins=nc;
 var no2=[];for(var e=0;e<obs.length;e++){if(obs[e].x>-30)no2.push(obs[e]);}obs=no2;
 s++;if(f%5==0)document.getElementById('sc').innerHTML=s;if(f%500==0)spd+=0.3;
 requestAnimationFrame(loop);
}
function jmp(){if(dead)return;if(!p.j){p.vy=-11;p.j=1;tone(500);}}
c.addEventListener('touchstart',function(e){e.preventDefault();jmp();},{passive:false});
function pay(){var v=document.getElementById('cd').value.trim().toUpperCase();if(v.length<8){alert('Lipa 20 bob kwa 0707811193 kwanza!');return;}var used=JSON.parse(localStorage.getItem('used')||'[]');if(used.includes(v)){alert('Code used already! Pay new 20!');return;}used.push(v);localStorage.setItem('used',JSON.stringify(used));document.getElementById('over').style.display='none';document.getElementById('cd').value='';dead=0;obs=[];coins=[];p.y=H-100-p.h;p.vy=0;loop();}
init();
</script>
</body>
</html>
