<script>
const c=document.getElementById('g'),x=c.getContext('2d');let W,H,p,obs=[],coins=[],s=0,bst=localStorage.jj_final||0,spd=6,f=0,dead=0;
document.getElementById('bs').innerText=bst;
function R(){W=c.width=innerWidth;H=c.height=innerHeight}R();addEventListener('resize',R);
function init(){obs=[];coins=[];s=0;f=0;spd=6;dead=0;p={x:70,y:H-140,w:28,h:50,vy:0,j:0};document.getElementById('o').classList.remove('show');document.getElementById('sc').innerText=0;loop()}
function drawHuman(px,py){
 let bob = dead?0:Math.sin(f*0.3)*2;
 x.fillStyle='#ffdbac'; x.beginPath(); x.arc(px+14,py+8+bob,10,0,7); x.fill();
 x.fillStyle='#3a1f0b'; x.fillRect(px+4,py-2+bob,20,8);
 x.fillStyle='#000'; x.fillRect(px+8,py+6+bob,2,2); x.fillRect(px+18,py+6+bob,2,2);
 x.fillStyle='#ff3b30'; x.fillRect(px+4,py+18,20,18);
 let arm = Math.sin(f*0.32)*6; x.fillStyle='#ffdbac'; x.fillRect(px-2,py+20+arm,6,12); x.fillRect(px+20,py+20-arm,6,12);
 let leg = Math.sin(f*0.32)*7; x.fillStyle='#1e3a8a'; x.fillRect(px+6,py+36+leg/2,7,14); x.fillRect(px+15,py+36-leg/2,7,14);
 x.fillStyle='#000'; x.fillRect(px+4,py+50+leg/2,11,4); x.fillRect(px+13,py+50-leg/2,11,4);
}
function loop(){if(dead)return;f++;x.clearRect(0,0,W,H);x.fillStyle='#5ec6ff';x.fillRect(0,0,W,H*0.65);x.fillStyle='#22c55e';x.fillRect(0,H*0.65,W,H*0.35);
 x.fillStyle='rgba(255,255,255,0.8)';for(let i=0;i<3;i++){let cx=(f*0.6+i*220)%(W+120)-60; x.beginPath(); x.arc(cx,55+i*28,14,0,7); x.arc(cx+14,55+i*28,18,0,7); x.arc(cx+28,55+i*28,14,0,7); x.fill();}
 if(f%75==0)obs.push({x:W,y:H*0.65-40,w:22,h:40}); if(f%92==0)coins.push({x:W,y:H*0.65-85-Math.random()*90,r:9});
 p.vy+=0.7;p.y+=p.vy;if(p.y>H*0.65-p.h){p.y=H*0.65-p.h;p.vy=0;p.j=0}
 drawHuman(p.x,p.y);
 x.fillStyle='#8B4513';obs.forEach(o=>{o.x-=spd;x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#5a2d0c';x.fillRect(o.x-3,o.y-4,o.w+6,6);x.fillStyle='#8B4513'});
 x.fillStyle='gold';x.strokeStyle='#b45309';x.lineWidth=2;coins.forEach(cl=>{cl.x-=spd;x.beginPath();x.arc(cl.x,cl.y,cl.r,0,7);x.fill();x.stroke()});
 for(let o of obs){if(p.x+4<o.x+o.w&&p.x+p.w-4>o.x&&p.y+4<o.y+o.h&&p.y+p.h>o.y){end();return}}
 coins=coins.filter(cl=>{if(p.x<cl.x+cl.r&&p.x+p.w>cl.x-cl.r&&p.y<cl.y+cl.r&&p.y+p.h>cl.y-cl.r){s+=20;return false}return cl.x>-25});
 obs=obs.filter(o=>o.x>-30);s++;if(f%5==0)document.getElementById('sc').innerText=s;if(f%450==0)spd+=0.35;requestAnimationFrame(loop)}
function end(){dead=1;if(s>bst){bst=s;localStorage.jj_final=bst;document.getElementById('bs').innerText=bst}document.getElementById('fs').innerText='Score: '+s+' Best: '+bst;document.getElementById('o').classList.add('show')}
function jmp(){if(!p.j&&!dead){p.vy=-12.8;p.j=1}}c.addEventListener('touchstart',e=>{e.preventDefault();if(!dead)jmp()},{passive:false});addEventListener('keydown',e=>{if(e.code=='Space'&&!dead)jmp()});
function stkPush(){let phone=prompt('Enter M-PESA number to receive STK push (07...):\n\n0707811193 will request 20 BOB');if(!phone)return;phone=phone.replace(/\s/g,'');if(phone.length<10){alert('Invalid number! Use 07...');return}alert('✅ STK PUSH SENT to '+phone+'!\n\n1. Check your phone now\n2. You will see M-PESA popup asking for PIN\n3. Enter your M-PESA PIN ON YOUR PHONE (not here)\n4. Pay 20 KES to 0707811193\n5. Copy M-PESA code and paste below\n\nWaiting for payment...');}

init();
</script>
